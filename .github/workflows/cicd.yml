name: Build-Push-Deploy

on:
  push:
    branches: ["main"]

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Build Java application
      - name: Build with Maven
        run: mvn -B clean package

      # 4. Login to Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest

      # 7. Deploy to EC2
      - name: Deploy Container to EC2 via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "Stopping old container..."

            docker rm -f javaapp || true

            echo "Pulling latest image..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest

            echo "Starting new container..."

            docker run -d \
              --name javaapp \
              -p 8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/java-docker-app:latest

            echo "Running containers..."

            docker ps
